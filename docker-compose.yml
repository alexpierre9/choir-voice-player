version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-2.0-flash}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - PYTHON_SERVICE_URL=http://localhost:8001
      - LOCAL_STORAGE_DIR=/var/lib/choir-files
      - PUBLIC_URL_BASE=${PUBLIC_URL_BASE:-http://localhost:3000/files}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - NODE_ENV=production
    depends_on:
      - db
    volumes:
      - choir_files:/var/lib/choir-files
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: choir_voice_player
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  choir_files:
