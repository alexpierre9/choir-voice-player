networks:
  platform_net:
    external: true

volumes:
  choir_files:

services:
  choir:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      PYTHON_SERVICE_URL: http://localhost:8001
      PYTHON_SERVICE_PORT: "8001"
      LOCAL_STORAGE_DIR: /var/lib/choir-files
      PUBLIC_URL_BASE: /files/
    volumes:
      - choir_files:/var/lib/choir-files
    networks:
      - platform_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
